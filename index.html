<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f7f9"><meta name="apple-mobile-web-app-capable" content="yes"><title>My Finances</title><link rel="manifest" href="manifest.webmanifest"><style>
*{box-sizing:border-box}body{margin:0;background:#f6f7f9;color:#182333;font:15px -apple-system,BlinkMacSystemFont,sans-serif}main{max-width:650px;margin:auto;padding:22px 17px 115px}h1{font-size:28px;letter-spacing:-1px;margin:10px 0}h2{font-size:18px;margin:0 0 12px}.muted{color:#788391;font-size:13px}.card{background:white;border:1px solid #edf0f3;border-radius:19px;padding:18px;margin:14px 0}.hero{background:#1d2b42;color:white}.hero .muted{color:#c3ccda}.big{font-size:37px;font-weight:750;margin:10px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid .card{margin:0}.number{font-size:23px;font-weight:700;margin-top:7px}.line{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #eef0f4}.line:last-child{border:0}.bar{height:9px;background:#e8edf4;border-radius:9px;overflow:hidden;margin:8px 0}.bar span{display:block;height:100%;background:#477bdb}.hero .bar{background:#42516a}.hero .bar span{background:#98bcff}label{display:block;font-weight:600;font-size:13px;margin:14px 0 6px}input,select,textarea{width:100%;border:1px solid #dfe4eb;border-radius:12px;padding:13px;background:white;color:#182333;font:inherit}textarea{min-height:75px}button{font:inherit;cursor:pointer}.primary{border:0;background:#2463e9;color:white;border-radius:12px;padding:13px 16px;font-weight:650}.secondary{border:0;background:#edf2f9;border-radius:12px;padding:11px 13px;color:#26384e}.danger{color:#b12a2a}.wide{width:100%}.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:#fffffff0;backdrop-filter:blur(12px);border-top:1px solid #e4e8ee;padding:9px 2px calc(10px + env(safe-area-inset-bottom))}.nav button{border:0;background:none;color:#84909f;display:grid;justify-items:center;gap:4px;font-size:11px;min-width:55px}.nav button b{font-size:22px}.nav .on{color:#2463e9;font-weight:700}.pill{background:#eef2f7;border-radius:20px;padding:6px 10px;font-size:12px}.empty{text-align:center;padding:25px;color:#84909f}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1}.chartrow{display:grid;grid-template-columns:90px 1fr 65px;gap:8px;align-items:center;margin:12px 0;font-size:12px}.small{font-size:12px}.notice{background:#eef4ff;padding:12px;border-radius:12px;line-height:1.5}canvas{width:100%;height:160px}button:focus-visible,input:focus-visible{outline:2px solid #2463e9}</style></head><body><main id="root"></main><nav class="nav" id="nav"></nav><script>
const K='myfinances_v1',C=['Restaurants','Groceries','Shopping','Travel','Gas','Car maintenance','Parking & tolls','Rent','Utilities','Phone & internet','Subscriptions','Entertainment','Healthcare','Personal care','Gifts','Education','Insurance','Household','Fees','Other'],P=['Cash','Debit','Credit card','Transfer'];let db={items:[],budget:0,categoryBudgets:{},reminder:true};try{db={...db,...JSON.parse(localStorage.getItem(K)||'{}')}}catch(e){};let tab='Home',edit=null,month=new Date().toISOString().slice(0,7),filter='',search='';const $=id=>document.getElementById(id),money=n=>Number(n||0).toLocaleString('en-US',{style:'currency',currency:'USD'}),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),today=()=>new Date().toLocaleDateString('en-CA'),save=()=>{try{localStorage.setItem(K,JSON.stringify(db))}catch(e){alert('Storage unavailable. Export a backup now.')}},items=()=>db.items.filter(x=>x.date.slice(0,7)===month),total=a=>a.reduce((s,x)=>s+Number(x.amount),0),byCat=a=>C.map(c=>({name:c,value:total(a.filter(x=>x.category===c))})).filter(x=>x.value>0).sort((a,b)=>b.value-a.value),progress=(v,max)=>'<div class="bar"><span style="width="'+(max?Math.min(100,v/max*100):0)+'%"></span></div>',header=t=>'<h1>'+t+'</h1>',line=(l,r)=>'<div class="line"><span>'+l+'</span><strong>'+r+'</strong></div>',monthControl=()=>'<label>Month</label><input type="month" id="month" value="'+month+'" onchange="month=this.value;render()">',chart=a=>a.map(x=>'<div class="chartrow"><span>'+esc(x.name)+'</span>'+progress(x.value,total(items()))+'<strong>'+money(x.value)+'</strong></div>').join('')||'<div class="empty">No expenses yet</div>';
function render(){const a=items(),sum=total(a),cats=byCat(a),daily=total(a.filter(x=>x.date===today()));let h='';
if(tab==='Home'){h=header('My Finances')+'<div class="muted">Your private expense dashboard</div>'+monthControl()+'<section class="card hero"><div class="muted">Spent this month</div><div class="big">'+money(sum)+'</div><div class="muted">Monthly budget: '+(db.budget?money(db.budget):'Not set')+'</div>'+progress(sum,db.budget)+(db.budget?'<div class="small">'+money(Math.max(0,db.budget-sum))+' remaining'+(sum>db.budget?' · Over budget!':'')+'</div>':'')+'</section><div class="grid"><section class="card"><div class="muted">Today</div><div class="number">'+money(daily)+'</div></section><section class="card"><div class="muted">Transactions</div><div class="number">'+a.length+'</div></section></div><section class="card"><h2>By category</h2>'+chart(cats)+'</section><section class="card"><h2>Recent expenses</h2>'+rows(a.slice().sort((x,y)=>y.date.localeCompare(x.date)).slice(0,6))+'<button class="secondary wide" onclick="tab=\'History\';render()">View all</button></section><section class="card"><h2>Spending insight</h2>'+insight(a,cats)+'</section>';}
if(tab==='Add'){const x=edit?db.items.find(y=>y.id===edit):null;h=header(x?'Edit expense':'New expense')+'<form class="card" id="entry"><label>Amount (USD)</label><input name="amount" inputmode="decimal" type="number" step=".01" min=".01" required value="'+(x?.amount||'')+'"><label>Category</label><select name="category">'+C.map(c=>'<option '+(x?.category===c?'selected':'')+'>'+c+'</option>').join('')+'</select><label>Merchant / purchase name</label><input name="merchant" required maxlength="100" placeholder="e.g. Chipotle, groceries, shoes" value="'+esc(x?.merchant||'')+'"><label>Date</label><input name="date" type="date" required value="'+(x?.date||today())+'"><label>Payment method</label><select name="payment">'+P.map(p=>'<option '+(x?.payment===p?'selected':'')+'>'+p+'</option>').join('')+'</select><label>Notes (optional)</label><textarea name="notes" maxlength="500">'+esc(x?.notes||'')+'</textarea><button class="primary wide" type="submit">'+(x?'Save changes':'Save expense')+'</button>'+(x?'<button type="button" class="secondary wide" style="margin-top:8px" onclick="edit=null;tab=\'History\';render()">Cancel</button>':'')+'</form>'; }
if(tab==='History'){const f=a.filter(x=>(!filter||x.category===filter)&&[x.merchant,x.category,x.payment,x.notes].join(' ').toLowerCase().includes(search.toLowerCase())).sort((x,y)=>y.date.localeCompare(x.date));h=header('Expense history')+monthControl()+'<section class="card"><label>Search expenses</label><input placeholder="Merchant, category, payment..." value="'+esc(search)+'" oninput="search=this.value;renderHistory()"><label>Category</label><select onchange="filter=this.value;render()"><option value="">All categories</option>'+C.map(c=>'<option '+(filter===c?'selected':'')+'>'+c+'</option>').join('')+'</select><div id="history">'+rows(f,true)+'</div></section>';}
if(tab==='Insights'){const prev=new Date(month+'-01T12:00:00');prev.setMonth(prev.getMonth()-1);const prior=total(db.items.filter(x=>x.date.slice(0,7)===prev.toISOString().slice(0,7)));h=header('Insights')+monthControl()+'<section class="card"><h2>Monthly comparison</h2>'+line('This month',money(sum))+line('Previous month',money(prior))+line('Difference',money(sum-prior))+'</section><section class="card"><h2>Categories</h2>'+chart(cats)+'</section><section class="card"><h2>Top merchants</h2>'+Object.entries(a.reduce((o,x)=>(o[x.merchant]=(o[x.merchant]||0)+Number(x.amount),o),{})).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([n,v])=>line(esc(n),money(v))).join('')+'</section><section class="card"><h2>Ask about spending</h2><input id="ask" placeholder="Try: restaurants, biggest, average, total"><button class="primary wide" style="margin-top:10px" onclick="ask()">Ask</button><p id="answer" class="notice">Private, rule-based answers. No cloud AI or data upload.</p></section>';}
if(tab==='Settings'){h=header('Settings')+'<section class="card"><h2>Budgets</h2><label>Overall monthly budget (USD)</label><input id="budget" type="number" min="0" step=".01" value="'+db.budget+'"><button class="primary wide" style="margin-top:10px" onclick="db.budget=Math.max(0,Number($(\'budget\').value)||0);save();render()">Save monthly budget</button><h2 style="margin-top:24px">Category budgets</h2>'+C.map((c,i)=>'<label>'+c+'</label><input type="number" min="0" step=".01" id="cb'+i+'" value="'+(db.categoryBudgets[c]||'')+'" placeholder="No limit">').join('')+'<button class="primary wide" style="margin-top:12px" onclick="saveCategories()">Save category budgets</button></section><section class="card"><h2>Backup & export</h2><p class="muted">Your data stays in this browser on this device. Export regular backups to Files; deleting Safari website data may erase your records.</p><div class="actions"><button class="secondary" onclick="download(\'json\')">Backup JSON</button><button class="secondary" onclick="download(\'csv\')">Export CSV</button></div><label>Restore JSON backup</label><input type="file" accept=".json,application/json" onchange="restore(this.files[0])"></section><section class="card"><h2>Daily reminder</h2><p class="muted">Offline iPhone PWAs cannot reliably schedule a daily push notification. Set a daily reminder in Apple's Reminders app. The app also shows a reminder when opened.</p><label><input type="checkbox" style="width:auto" '+(db.reminder?'checked':'')+' onchange="db.reminder=this.checked;save()"> Show in-app reminder</label></section><section class="card"><h2>Privacy</h2><p class="muted">No account, ads, bank connections, analytics trackers, or server-side expense storage. This prototype is not an encrypted vault.</p></section>';}
$('root').innerHTML=h;$('nav').innerHTML=[['Home','⌂'],['History','☷'],['Add','＋'],['Insights','▥'],['Settings','⚙']].map(([t,i])=>'<button class="'+(tab===t?'on':'')+'" onclick="tab=\''+t+'\';if(t!==\'Add\')edit=null;render()"><b>'+i+'</b>'+t+'</button>').join('');if(tab==='Add')$('entry').onsubmit=submit;if(tab==='Home'&&db.reminder&&!a.some(x=>x.date===today())){$('root').insertAdjacentHTML('beforeend','<p class="notice">Reminder: Have you recorded today’s expenses?</p>')}}
function rows(a,actions=false){return a.length?a.map(x=>'<div class="line"><div><strong>'+esc(x.merchant)+'</strong><div class="muted">'+esc(x.category)+' · '+esc(x.date)+' · '+esc(x.payment)+'</div>'+(actions?'<div class="actions" style="margin-top:8px"><button class="secondary" onclick="edit=\''+x.id+'\';tab=\'Add\';render()">Edit</button><button class="secondary danger" onclick="removeItem(\''+x.id+'\')">Delete</button></div>':'')+'</div><strong>'+money(x.amount)+'</strong></div>').join(''):'<div class="empty">No expenses found</div>'}
function renderHistory(){const f=items().filter(x=>(!filter||x.category===filter)&&[x.merchant,x.category,x.payment,x.notes].join(' ').toLowerCase().includes(search.toLowerCase())).sort((x,y)=>y.date.localeCompare(x.date));$('history').innerHTML=rows(f,true)}
function submit(e){e.preventDefault();const v=Object.fromEntries(new FormData(e.target));if(!Number.isFinite(+v.amount)||+v.amount<=0)return alert('Enter a valid amount');const x={...v,amount:Math.round(+v.amount*100)/100,id:edit||crypto.randomUUID()};if(edit)db.items=db.items.map(y=>y.id===edit?x:y);else db.items.push(x);save();edit=null;month=x.date.slice(0,7);tab='Home';render()}
function removeItem(id){if(confirm('Delete this expense?')){db.items=db.items.filter(x=>x.id!==id);save();render()}}
function saveCategories(){C.forEach((c,i)=>{const v=Math.max(0,Number($('cb'+i).value)||0);if(v)db.categoryBudgets[c]=v;else delete db.categoryBudgets[c]});save();alert('Budgets saved')}
function insight(a,c){if(!a.length)return '<p class="muted">Add expenses to see spending insights.</p>';const top=c[0],limit=db.categoryBudgets[top.name];return '<p>Your largest category is <strong>'+esc(top.name)+'</strong> at <strong>'+money(top.value)+'</strong> ('+Math.round(top.value/total(a)*100)+'% of monthly spending).</p>'+(limit?'<p>Category budget: '+money(limit)+(top.value>limit?' — exceeded.':' — on track.')+'</p>':'')+'<p class="muted">Based only on expenses you entered.</p>'}
function ask(){const q=$('ask').value.toLowerCase(),a=items(),c=byCat(a);let s;if(q.includes('biggest')||q.includes('largest')){const x=a.slice().sort((x,y)=>y.amount-x.amount)[0];s=x?'Largest purchase: '+x.merchant+' — '+money(x.amount):'No expenses this month.'}else if(q.includes('average'))s='Average expense: '+money(a.length?total(a)/a.length:0);else if(q.includes('total')||q.includes('spent'))s='Total spent this month: '+money(total(a));else{const m=c.find(x=>q.includes(x.name.toLowerCase())||x.name.toLowerCase().includes(q.trim())&&q.trim().length>2);s=m?m.name+': '+money(m.value):'Try asking about total, average, biggest purchase, or a category.'}$('answer').textContent=s}
function download(type){const data=type==='json'?JSON.stringify(db,null,2):[['Date','Merchant','Category','Amount','Payment','Notes'],...db.items.map(x=>[x.date,x.merchant,x.category,x.amount,x.payment,x.notes])].map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const u=URL.createObjectURL(new Blob([data],{type:type==='json'?'application/json':'text/csv'}));const a=document.createElement('a');a.href=u;a.download='my-finances-'+today()+'.'+type;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
async function restore(f){if(!f)return;try{const x=JSON.parse(await f.text());if(!Array.isArray(x.items)||!x.items.every(i=>i.id&&i.date&&i.merchant&&Number.isFinite(+i.amount)))throw Error('Invalid backup');if(!confirm('Replace all current data with this backup?'))return;db={items:x.items,budget:Number(x.budget)||0,categoryBudgets:x.categoryBudgets||{},reminder:x.reminder!==false};save();render();alert('Backup restored')}catch(e){alert('Could not restore: '+e.message)}}
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});render();
</script></body></html>
